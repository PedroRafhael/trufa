<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Encomendas - Faustino</title>
    <style>
        body {
            background-color: #4b2e03;
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        header {
            background-color: #4b2e03;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
        }

        h1 {
            color: white;
            text-align: center;
            margin-top: 50px;
        }

        h2 {
            color: white;
            text-align: center;
            font-size: 40px;
        }

        h3 {
            color: #e9e7e4;
            text-align: center;
            font-size: 20px;
            font-weight: normal;
        }

        main {
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        .cartao {
            background-color: #f7f5f3;
            border-radius: 30px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            color: #4b2e03;
            font-size: 16px;
            font-weight: bold;
        }

        input, select, textarea {
            padding: 10px;
            border-radius: 15px;
            border: 1px solid #d8d3cd;
            font-size: 16px;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            background-color: #1ebd59;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <h1>Faustino</h1>
            <a href="portifolio.html"><b>Portifólio</b></a>
            <a href="sabores.html"><b>Sabores</b></a>
            <a href="encomenda.html"><b>Encomendas</b></a>
            <a href="contato.html"><b>Contato</b></a>
        </nav>
    </header>

    <h2>Faça sua encomenda</h2>
    <h3>Preencha os dados e envie direto pelo WhatsApp</h3>

    <main>
        <div class="cartao">
            <form id="formEncomenda">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>

                <label for="sabor">Sabor</label>
                <select id="sabor" name="sabor">
                    <option value="Café">Café</option>
                    <option value="sensacao">Alpino</option>
                    <option value="limao">Sensação</option>
                    <option value="alpino">Limao</option>
                    <option value="oreo">Oreo</option>
                </select>

                <label for="quantidade">Quantidade</label>
                <input type="number" id="quantidade" name="quantidade" min="1" value="1">

                <label for="observacoes">Observações</label>
                <textarea id="observacoes" name="observacoes" placeholder="Alguma observação sobre a encomenda?"></textarea>

                <label for="contato">Seu telefone / WhatsApp</label>
                <input type="tel" id="contato" name="contato" placeholder="(00) 00000-0000">

                <button type="submit">Enviar pelo WhatsApp</button>
            </form>
        </div>
    </main>

    <script>
        // Número que vai RECEBER as encomendas (formato: 55 + DDD + número, só dígitos)
        const numeroDestino = "5551996459752"; // <-- confirme/ajuste este número

        document.getElementById('formEncomenda').addEventListener('submit', function (e) {
            e.preventDefault();

            const nome = document.getElementById('nome').value;
            const sabor = document.getElementById('sabor').value;
            const quantidade = document.getElementById('quantidade').value;
            const observacoes = document.getElementById('observacoes').value;
            const contato = document.getElementById('contato').value;

            let mensagem = `Olá! Gostaria de fazer uma encomenda 🍫%0A%0A`;
            mensagem += `*Nome:* ${nome}%0A`;
            mensagem += `*Sabor:* ${sabor}%0A`;
            mensagem += `*Quantidade:* ${quantidade}%0A`;
            if (observacoes) mensagem += `*Observações:* ${observacoes}%0A`;
            if (contato) mensagem += `*Meu contato:* ${contato}%0A`;

            const url = `https://wa.me/${numeroDestino}?text=${mensagem}`;
            window.open(url, '_blank');
        });
    </script>
</body>
</html>
